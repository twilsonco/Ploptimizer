# Complex test job specification for the PLT-Optimizer generate pipeline.
#
# Designed to stress-test every layer of the pipeline in a single run:
#   - Constrained multi-plate packing (24x16 primary + 24x12 scrap sheet)
#   - Full inheritance cascade: TextLine -> LabelSpec -> JobSpec -> defaults
#   - Cutter selection across the whole IDEAL_CUTTER_MAP range (0.125" - 1.5")
#   - Auto-sizing (bounding-box calculation) mixed with fixed dimensions
#   - Job-level hole inheritance, label-level hole overrides, and holes: []
#     suppression of inherited holes
#   - Location-only drill holes: ``location`` alone is a valid hole spec and
#     implies the default 0.125" diameter; an explicit ``diameter`` overrides
#     it (see corner_drill)  #   - Group hole-location shorthands: ``corners`` (all four corners) and
  #     ``sides`` (left + right) expand into their atomic member holes at
  #     parse time (see valve_tag / group_holes)#   - hole_margin cascade: job-level default inset plus a label-level override
#   - Horizontal text compression: over-wide lines are uniformly squeezed
#     (bounded by max_h_compress) so they respect the label margins
#   - Horizontal text alignment: per-line left/right anchoring at the label
#     margins plus label-level inheritance of the alignment default
#   - Replacement text file template (EngraveLab/Vision Pro "badges") mixed
#     with fully static labels in one job
#   - High-count volume labels forcing overflow onto the second plate
#
# Run with: python run_integration_test.py tests_deps/complex_test_job.yaml
job:
  job_name: "Complex Plant Signage - Batch 42"

  # ---------------------------------------------------------------------
  # Job-level defaults (cascade down to every label / text line unless
  # overridden). Includes a job-level hole to verify inheritance.
  # ---------------------------------------------------------------------
  text_height: 0.3
  character_spacing: 0.04
  line_spacing: 0.3
  margin: 0.15
  hole_margin: 0.1875
  min_hole_margin: 0.1

  # Allow over-wide text lines to be uniformly compressed horizontally by up
  # to 50% of their natural width so they respect the label margins (e.g.
  # "SAFETY long long text" in mixed_height_motto). Lines that already fit
  # are never touched. Cascades job -> label -> text line.
  max_h_compress: 0.5

  # ---------------------------------------------------------------------
  # Constrained mode: exactly these two sheets are available. Total label
  # area (~475 sq in) exceeds plate_1's 384 sq in, forcing multi-plate
  # allocation across both bins.
  # ---------------------------------------------------------------------
  plates:
    - id: plate_1
      width: 24.0
      height: 16.0
      left_clearance: 0.2
      top_clearance: 0.2
      clearance_padding: 0.125
    - id: plate_2_scrap
      width: 24.0
      height: 12.0
      left_clearance: 0.5
      top_clearance: 0.5
      clearance_padding: 0.25

  labels:
    # 1. Volume + edge holes: 60 instances guarantee overflow past plate_1.
    #    The ``sides`` group shorthand (left + right) overrides the
    #    inherited job hole, exercising group expansion at parse time.
    - id: valve_tag
      count: 60
      width: 3.0
      height: 1.0
      margin: 0.125
      text_height: 0.25
      content:
        - text: "VALVE V-104"
        - text: "OPEN CW"
      holes:
        - location: sides

    # 2. Per-line typography overrides: each line picks its own text_height,
    #    exercising three different cutter selections within one label.
    - id: panel_header
      count: 4
      width: 6.0
      height: 2.0
      margin: 0.1
      content:
        - text: "MAIN PANEL"
          text_height: 0.5
        - text: "SECTION B REV 4"
        # (inherits job text_height 0.3)
        - text: "MAINTENANCE ACCESS ONLY"
          text_height: 0.2

    # 3. Extreme mixed heights: 1.0" / 0.25" / 0.125" lines verify cutter
    #    lookup across the full inventory range incl. exact matches.
    - id: mixed_height_motto
      count: 2
      width: 5.0
      height: 1.5
      content:
        - text: "SAFETY horizontally compressed text"
          text_height: 0.5
        - text: "FIRST"
          text_height: 0.25
        - text: "ZERO HARM ZONE"
          text_height: 0.125

    # 4. All four corner hole locations: three location-only holes (default
    #    0.125" diameter) plus one explicit 0.1875" override on top-right.
    #    The explicit hole_margin overrides the job-level default for this
    #    label only.
    - id: corner_drill
      count: 8
      width: 2.5
      height: 2.0
      text_height: 0.4
      hole_margin: 0.1875
      content:
        - text: "DRILL"
        - text: "PATTERN"
      holes:
        - location: top-left
        - location: top-right
          diameter: 0.1875
        - location: bottom-right
        - location: bottom-left

    # 5. Oversize single-instance label: 1.5" text maps to the largest
    #    common cutter (0.187"); verifies large glyph vectorization.
    - id: big_banner
      count: 1
      width: 10.0
      height: 3.0
      text_height: 1.5
      content:
        - text: "OVERSIZE"

    # 6. Auto-sizing: no width/height, bounding-box calculation from
    #    content. Inherits job margin/typography and the job-level hole.
    - id: auto_warning
      count: 6
      text_height: 0.3
      content:
        - text: "WARNING"
        - text: "HIGH VOLTAGE"

    # 7. holes: [] explicitly suppresses the inherited job-level hole.
    - id: serial_tag
      count: 10
      width: 5.0
      height: 1.0
      text_height: 0.35
      content:
        - text: "SERIAL 0000-0000"
      holes: []

    # 8. Top/bottom edge holes, location-only (default 0.125" diameter).
    - id: edge_holes
      count: 4
      width: 4.0
      height: 1.0
      text_height: 0.2
      hole_margin: 0.1
      min_hole_margin: 0.05
      content:
        - text: "TOP/BOT DRILL"
      holes:
        - location: top
        - location: bottom

    # 9. Horizontal text alignment: one label, three anchorings. "left"
    #    places the line's left-most point precisely at the left margin,
    #    "right" anchors the right-most point at the right margin, and the
    #    middle line inherits the default "center". Cascades
    #    text line -> label -> job (default "center").
    - id: alignment_demo
      count: 4
      width: 6.0
      height: 1.5
      text_height: 0.3
      content:
        - text: "LEFT ALIGNED"
          text_h_alignment: left
        - text: "CENTERED (default)"
        - text: "RIGHT ALIGNED"
          text_h_alignment: right

    # 10. Label-level alignment inheritance: both lines have no explicit
    #     value, so they inherit "right" from the label (label -> line
    #     cascade). A per-line override would win over the label value.
    - id: right_aligned_tag
      count: 6
      width: 4.0
      height: 1.0
      text_height: 0.25
      text_h_alignment: right
      content:
        - text: "INHERIT RIGHT"
        - text: "ALSO RIGHT"

    # 11. Group hole-location shorthands: ``corners`` expands to all four
    #     corner holes and ``sides`` to left + right (same expansion valve_tag
    #     uses). The 0.25" diameter on the group entry is inherited by every
    #     expanded corner hole, verifying diameter propagation through
    #     expansion; the sides group keeps the default 0.125".
    - id: group_holes
      count: 4
      width: 4.0
      height: 2.0
      text_height: 0.3
      content:
        - text: "GROUP DRILL"
      holes:
        - location: corners
          diameter: 0.25
        - location: sides

    # 12. Replacement text file template (EngraveLab/Vision Pro "badge"):
    #     tests_deps/replacement_text_complex.txt drives the content; its
    #     line count (3) determines the instance count (badge_0000 ..
    #     badge_0002), so `count` must not be set alongside it. The
    #     `content` lines are placeholders declaring per-line attributes;
    #     the file's semicolon-delimited items replace only `text`. The
    #     three file lines exercise every merge path:
    #       - "PUMP P-101;FEED WATER" -> exactly 2 items: both template
    #         lines render with their placeholder attributes.
    #       - "VALVE V-201" -> fewer items than template lines: renders a
    #         single line, block stays vertically centered.
    #       - "COMPRESSOR C-3;AIR HEADER;MAINTENANCE" -> more items: the
    #         third line is an extra line inheriting label-level attrs.
    - id: badge
      width: 4.0
      height: 1.9
      replacement_text_file: replacement_text_complex.txt
      content:
        - text: "PLACEHOLDER LINE 1"
          text_height: 0.45
        - text: "PLACEHOLDER LINE 2"
          text_h_alignment: center
