# Jobset export fixture B: the same plate geometry as jobset_exp_a.yaml, a
# label whose id (`main`) collides with that file's, and a DIFFERENT text
# cutter and colour - so a shared sheet yields one text file per
# (job, cutter, colour) layer, not one merged file.
job:
  job_name: Export Beta
  layout: columns
  plates:
    - id: plate1
      width: 24.0
      height: 16.0
  labels:
    - id: main
      width: 5.0
      height: 2.0
      cutter_size: 0.035
      text_color: blue
      content:
        - text: BETA MAIN
          text_height: 0.6
        - text: SECOND LINE
          text_height: 0.4
      holes:
        - location: top-left
        - location: top-right
