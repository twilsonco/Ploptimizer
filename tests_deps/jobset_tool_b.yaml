# Jobset tool-option fixture B: same plate geometry, a different cutter speed
# (2.5 in/s) - the batch must not write A's VS header onto B's strokes.
job:
  name: Tool Beta
  layout: columns
  plates:
    - id: plate1
      width: 24.0
      height: 16.0
  labels:
    - id: main
      width: 5.0
      height: 2.0
      content:
        - text: BETA MAIN
          text_height: 0.6
  tool_options:
    cutting_velocity: 2.5
