# examples/job_specs/space_job.yaml -- worked samples for `<space>`.
#
# Pairs drive most assertions: each `<space>` label sits next to a plain
# `control` label with the same words, box and alignment, so the test compares
# marked ink against unmarked ink and never pins a glyph's advance width.
# 7 labels are marked, 5 are the plain twins (l12 has none).
#
#   l1  bare <space> mid-line, left-aligned (the default): margin to margin
#   l2  plain twin of l1
#   l3  leading <space>: right-aligns RIGHT with no <c:right>
#   l4  <c:right> twin of l3
#   l5  trailing <space>: rides the left margin, slack behind the ink
#   l6  plain twin of l5
#   l7  <space:0>: collapses the gap to the plain space advance
#   l8  plain twin of l7
#   l9  <space> nested in <u>: the underline spans the gap
#   l10 plain twin of l9
#   l11 two lines, each marked: line 0 has no slack (keeps its minimum and
#       overflows the box), line 1 has all of it (margin to margin)
#   l12 <space:3> on a box-wide line: the floor wins, no fill is left
#
# Every label is `width: 3.0` / `height: 1.0` at the 0.1 job margin, so the
# text box is [0.1, 2.9] in label-local inches for every line: the marked
# ink rides that box's edges and a border rect spans exactly it.
#
# Pinned end-to-end by tests/test_space_example.py (the frozen-fixture twin of
# this sample lives in tests_deps/ only when a test reads it directly).
job:
  job_name: "Space Tag Fixture"
  width: 3.0
  height: 1.0
  margin: 0.1
  text_height: 0.5
  line_spacing: 0.15
  auto_descending_character_adjustment: false
  font: Dino
  plates:
    - id: plate_1
      width: 24.0
      height: 16.0
  labels:
    - id: l1
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "GG<space>GG"

    - id: l2
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "GG GG"

    - id: l3
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "<space>RIGHT"

    - id: l4
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "RIGHT"
          text_h_alignment: right

    - id: l5
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "LEFT<space>"

    - id: l6
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "LEFT"

    - id: l7
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "GG<space:0>GG"

    - id: l8
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "GG GG"

    - id: l9
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "<u>GG<space>GG</u>"

    - id: l10
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "<u>GG GG</u>"

    - id: l11
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "AAAA<space>BBBB"
        - text: "DD<space>EE"

    - id: l12
      font: Dino
      width: 3.0
      height: 1.0
      content:
        - text: "S<scale:3>3</scale>YY<space>ZZ"
