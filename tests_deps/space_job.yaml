# examples/job_specs/space_job.yaml -- worked samples for `<space>`.
#
# Pairs drive most assertions: each `<space>` label sits next to a plain
# `control` label with the same words, box and alignment, so the test compares
# marked ink against unmarked ink and never pins a glyph's advance width.
# 7 labels are marked, 5 are the plain twins (l12 has none).
#
#   l1  bare <space> mid-line, left-aligned (the default): margin to margin
#   l2  plain twin of l1
#   l3  <space:0> mid-line: the ROOMY-regime pair of l1 (a floor below 1.0 is
#       inert when the line has room, so l3 == l1 ink for ink)
#   l4  <space> nested in <u>: the underline spans the gap
#   l5  plain <u> twin of l4
#   l6  two gaps in one line
#   l7  leading <space>: right-aligns RIGHT with no <c:right>
#   l8  trailing <space>: rides the left margin, slack behind the ink
#   l9  plain CENTER twin (the unmarked reference for l7/l8's placement)
#   l10 two lines, each marked: line 0 has no slack (keeps its minimum and
#       overflows the box), line 1 has all of it (margin to margin)
#   l11 plain twin of l10
#   l12 <space> inside a <scale:2> run
#   l13 plain twin of l12
#   l14/l15/l16 the TIGHT trio (width 2.5, max_h_compress 0.7): the hierarchy
#       -- <space:0> gives ground the bare <space> keeps, and its text is
#       squeezed less for it
#
# Every label is `width: 3.0` / `height: 1.0` at the 0.1 job margin, so the
# text box is [0.1, 2.9] in label-local inches for every line: the marked
# ink rides that box's edges and a border rect spans exactly it.
#
# Pinned end-to-end by tests/test_space_example.py (the frozen-fixture twin of
# this sample lives in tests_deps/ only when a test reads it directly).
job:
  job_name: "Space Tag Fixture"
  width: 6
  height: 2
  layout: columns-simple
  text_height: 0.5
  font: Dino
  labels:
    - id: l1
      content:
        - text: "GG<space>GG"

    - id: l2
      content:
        - text: "GG GG"

    - id: l3
      content:
        - text: "GG<space:0>GG"

    - id: l4
      content:
        - text: "<u>GG<space>GG</u>"

    - id: l5
      content:
        - text: "<u>GG GG</u>"

    - id: l6
      content:
        - text: "GG<space>GG<space>GG"

    - id: l7
      content:
        - text: "<space>RIGHT"

    - id: l8
      content:
        - text: "LEFT<space>"

    - id: l9
      content:
        - text: "CENTER"

    - id: l10
      content:
        - text: "AAAA<space>BBBB"
        - text: "DD<space>EE"

    - id: l11
      content:
        - text: "AAAA BBBB"
        - text: "DD EE"

    - id: l12
      content:
        - text: "S<scale:2>3</scale>YY<space>ZZ"

    - id: l13
      content:
        - text: "S<scale:2>3</scale>YY ZZ"

    # ---- compression trio: the TIGHT regime, where the HIERARCHY lives.
    # width 2.5 -> box 2.25, far under the 5.516in these words need, so the
    # line is margin-fit compressed (to 0.7, the deepest the trio permits).
    # Margin-fit compression, NOT the shared scale: a global scale multiplies
    # EVERY line by the same factor, so a short line ends up compressed AND
    # roomy and its gaps never contract. In this regime the gaps pay FIRST:
    #   l15 (bare <space>) == l16 (plain twin) -- a marked space is the normal
    #       case, so the reservation changes nothing, bit for bit;
    #   l14 (<space:0>) is NARROWER by the advance the gap gave up, because the
    #       floor let the gap contract before the text was squeezed.
    - id: l14
      content:
        - text: "AAAAAAA<space:0>BBBBBBB"

    - id: l15
      content:
        - text: "AAAAAAA<space>BBBBBBB"

    - id: l16
      content:
        - text: "AAAAAAA BBBBBBB"
