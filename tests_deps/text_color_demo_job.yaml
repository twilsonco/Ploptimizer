# Stroke-color toolpath-split demo job for the PLT-Optimizer generate pipeline.
#
# Pins the ``text_color`` layer-tag behaviour (schema.TextColor) for 3-layer
# engraving stock: three text lines share identical typography (same height,
# spacing, alignment and therefore the same cutter), so without colors they
# would all engrave as ONE toolpath. The label-level line ("BASE") carries no
# color (implicit "none"); the other two lines pick real stroke colors
# (black/k and magenta/m, written as case-insensitive abbreviations), which
# splits the label's text into three separate toolpaths -- one HPGL SP layer
# and one PLT file each -- so the cutter depth can be changed between runs to
# expose a different material layer color (EngraveLab/Vision Pro workflow).
#
# Export names: the colorless layer keeps the historical
# ``0.045_txt_<job>.plt`` name; colored layers gain their 1-letter
# suffix (``0.045_k_txt_<job>.plt``, ``..._m_txt_...``).
#
# Run with: python run_integration_test.py tests_deps/text_color_demo_job.yaml
job:
  job_name: "Text Color Demo - 3-Layer Panel"

  # Shared label dimensions and typography (cascade to every label).
  width: 3.0
  height: 1.5
  margin: 0.15
  text_height: 0.375

  plates:
    - id: scrap_24x16
      width: 24.0
      height: 16.0

  labels:
    - id: panel
      count: 2
      content:
        # Same cutter, three colors -> three toolpaths:
        - text: "TOP LAYER"
          text_color: k # black (abbreviation, depth run 1)
        - text: "MID LAYER"
          text_color: m # magenta (abbreviation, depth run 2)
        - text: "BASE" # implicit "none" color (depth run 3)
