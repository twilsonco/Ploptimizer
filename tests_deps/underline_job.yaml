# Fixture for inline underline markup (`underline_offset_fraction`, the
# `<u>` tag) and
# for NESTED markup (`<i>` wrapping `<u>`).
#
# `<u>` draws a centerline underline with the line's own text cutter: its
# centerline sits `cutter_diameter + underline_offset_fraction * cap height`
# below the
# baseline (cap height = toolpath_text_height = capline - baseline), so the
# engraved underline's top edge floats exactly
# `underline_offset_fraction * cap height` below the engraved baseline stroke
# (0.0 = the two
# strokes touch, the classic underline). Each maximal underlined run spans
# its first glyph's bounding-box left edge to its last glyph's right edge.
#
# The break test is STRICTLY HORIZONTAL: a glyph cuts the underline only where
# its ink crosses the underline's CENTERLINE (`line_y`), inside a thin band of
# `0.2 * underline_break_clearance_fraction * cap height` above and below it
# -- never merely for
# standing beside it, and never merely for dipping below it. A 2D radial test
# would be wrong: its distance grows with the vertical separation too, so a cap
# sitting above the underline collides through the vertical component and
# shatters the underline. A half-plane test (everything below the underline's
# top edge) is also wrong: a `g`'s open J-hook dips its whole bowl below the
# underline, so the break swallows the glyph's full width instead of just the
# stem that crosses through.
# Equivalently: **a glyph breaks the underline where its ink crosses the
# centerline, i.e. dips more than `cutter + underline_offset_fraction * cap
# height` below the
# baseline**, so the offset alone decides *which*
# glyphs break and `underline_break_clearance_fraction` alone decides the air
# at each
# break (each cut is padded by `0.5 * cutter + clearance`; the half cutter is
# the glyph stroke's own half-width, the ink being a centerline). With the Dino
# library at text_height 0.5 (toolpath 0.44) the caps `AVX`/`O`/`G` sit on (or
# a hair under) the baseline and never reach the centerline a full cutter
# below, so they cut no gap at any offset; `p`/`g` reach ~0.146in below and
# cross the centerline at every offset below that.
#
# Nesting is the framework's stack: `<i>nested <u>markup</u> tail</i>` shears
# every glyph about the baseline AND underlines only `markup`. The underline
# is computed on the FINAL (sheared, kerned) geometry, so it stays horizontal
# under its run and its span follows the slanted bounding boxes.
#
# The underline is a stroke of its line's block, so it is text ink: it counts
# toward the line's rendered bounds, the vertical margins, and the label's
# vertical centering (an underlined bottom line raises the block).
#
# No plate declares a material and the job packs onto one sheet, so emitted
# names carry no plate/material prefix. `max_h_compress` stays unset (0.0):
# no line compresses, so every pinned number below is pure underline geometry.
job:
  job_name: Underline Demo

  width: 3.0
  height: 1.0
  margin: 0.1
  text_height: 0.5
  line_spacing: 0.15
  auto_descending_character_adjustment: false

  plates:
    - id: plate_1
      width: 24.0
      height: 16.0

  labels:
    # 1. PLT underline at the default 0.0 offset: the `p` stem crosses the
    #    underline's centerline and punches its gap, so the one run engraves as
    #    two collinear segments (both at y = -cutter).
    - id: plt_underline
      font: Dino
      content:
        - text: "<u>Depth</u>"

    # 2. The plain control for label 1: same glyphs, no underline, so the
    #    ink box stops at the descender's depth instead of at the underline.
    - id: plt_plain
      font: Dino
      content:
        - text: "Depth"

    # 3. A descender-free run: the caps sit a full cutter above the
    #    centerline and never cross it, so the underline is ONE segment
    #    spanning the run's full ink width.
    - id: plt_caps
      font: Dino
      content:
        - text: "<u>AVX</u>"

    # 4. The plain control for label 3.
    - id: plt_caps_plain
      font: Dino
      content:
        - text: "AVX"

    # 5. underline_offset_fraction 0.25 lifts the required air to 0.25 * cap
    #    height (0.11in at the fixture's 0.44in cap): the centerline sits
    #    deeper (-(cutter + 0.11) = -0.17, below the ~0.146in descender
    #    depth), so the caps' air grows, the `p` no longer breaks the run,
    #    and the underline is strictly deeper than
    #    label 1's.
    - id: plt_offset
      font: Dino
      underline_offset_fraction: 0.25
      content:
        - text: "<u>Depth</u>"

    # 5b. underline_break_clearance_fraction 0.1 adds air at each break
    #     (0.044in at the fixture's 0.44in cap; every cut is
    #     padded by 0.5 * cutter + 0.1 * cap), so the engraved air between a
    #     descender's stroke and the underline's cut edge is 0.044in. The
    #     centerline stays at the default offset (one cutter below the
    #     baseline), so this isolates the break-clearance knob from the
    #     break-deciding offset knob.
    - id: plt_break_clearance
      font: Dino
      underline_break_clearance_fraction: 0.1
      content:
        - text: "<u>pay</u>"

    # 5c. The clearance-0.0 control for label 5b (the cut sits at the ink).
    - id: plt_break_clearance_plain
      font: Dino
      content:
        - text: "<u>pay</u>"

    # 6. Nested markup: every glyph shears (italic) while only `markup` is
    #    underlined. The underline is horizontal and spans just that run.
    - id: plt_nested
      width: 6.0
      font: Dino
      content:
        - text: "<i>nested <u>markup</u> tail</i>"

    # 7. The italic control for label 6 (no underline at all).
    - id: plt_nested_italic_only
      width: 6.0
      font: Dino
      content:
        - text: "<i>nested markup tail</i>"

    # 8. Two underlined runs separated by a plain glyph: two independent
    #    underlines, and the plain `C` keeps its air (no underline beneath).
    - id: plt_multi_run
      font: Dino
      content:
        - text: "A<u>bb</u>C<u>dd</u>"

    # 9. A partial run: the underline spans only the underlined glyphs' ink,
    #    strictly narrower than the whole line.
    - id: plt_partial
      font: Dino
      content:
        - text: "A<u>bb</u>C"

    # 10. The plain control for label 9.
    - id: plt_partial_plain
      font: Dino
      content:
        - text: "AbbC"

    # 11. TrueType underline through the ftext path: the same centerline
    #     geometry as the PLT family (the font's own underline metrics are
    #     deliberately not consulted).
    - id: ttf_underline
      font: ReliefSingleLineCAD-Regular
      content:
        - text: "<u>Depth</u>"

    # 12. The TTF control for label 11.
    - id: ttf_plain
      font: ReliefSingleLineCAD-Regular
      content:
        - text: "Depth"

    # 13. Underline + small caps: the shrunken lowercase glyphs sit on the
    #     baseline, so a ` SC` font underlines its capitals' width and the
    #     small glyphs cut no gaps of their own.
    - id: plt_small_caps
      font: "Dino SC"
      content:
        - text: "<u>Depth</u>"

    # 14. A multi-word run at the default (continuous) underline: the space
    #     between the words is underlined too, so the descender-free run
    #     engraves as ONE segment spanning both words.
    - id: plt_continuous_words
      width: 6.0
      font: Dino
      content:
        - text: "<u>hello world</u>"

    # 15. The same run with underline_break_spaces: true -- the underline ends
    #     at the space, so each word gets its own underline spanning its own
    #     ink and the inter-word space stays bare (two segments).
    - id: plt_break_spaces_words
      width: 6.0
      font: Dino
      underline_break_spaces: true
      content:
        - text: "<u>hello world</u>"
