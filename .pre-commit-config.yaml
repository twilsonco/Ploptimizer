# See https://pre-commit.com for more information
repos:
  - repo: local
    hooks:
      # NOTE: The --extra flags below MUST mirror the uv sync commands used in
      # .github/workflows/ci.yml (type-check job: --extra dev --extra plotting,
      # the superset of what these hooks need). mypy/ruff live in the `dev`
      # extra, which is NOT part of uv's default environment; without the flag,
      # `uv run` does not manage their versions from uv.lock and the hook can
      # silently use a stale local toolchain, letting CI fail on a version
      # mypy/ruff never sees. All three hooks share the SAME extras so uv
      # syncs the venv once per commit instead of flip-flopping packages.
      #
      # SCOPE: the two ruff hooks cover the WHOLE repo (tests/, scripts/,
      # docs/, examples/ included) so lint debt cannot accumulate outside the
      # package the way it did when these ran on plt_optimizer/ only. mypy
      # stays scoped to plt_optimizer/: it runs in strict mode, and typing the
      # test suite to that bar is a separate project.
      - id: ruff-check
        name: ruff check
        entry: uv run --extra dev --extra plotting ruff check .
        language: system
        pass_filenames: false
        types_or: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev --extra plotting ruff format .
        language: system
        pass_filenames: false
        types_or: [python]

      - id: mypy
        name: mypy type check
        entry: uv run --extra dev --extra plotting mypy plt_optimizer/
        language: system
        pass_filenames: false
        types_or: [python]
