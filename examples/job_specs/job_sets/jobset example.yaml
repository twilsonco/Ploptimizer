# Batch two job files onto one pool of plates.
#
# Each member is a complete job spec in its own file; this document only lists
# them, in the order their strokes are laid out. One `generate` run packs every
# label of the set onto the merged plate list, writes each plate as one toolpath
# segment per job (so a shared sheet yields `kw_45_txt_Job_A.plt` and
# `kw_60_txt_Job_B.plt`, engraved pass by pass), and produces a report per job
# plus a batch report that splits the travel by job.
#
# Run:
#   plt-optimizer generate --jobset "jobset example.yaml"
#
# Paths are relative to this file. A jobset cannot contain a jobset.
#
# The common shape is the short list form (`jobset:` directly listing `job:`
# entries, as in README.md). This example uses the mapping form because it
# names the batch: `name` becomes the jobset id - the key of the combined
# plate proofs (`all_evening_batch.pdf`) and of the batch report. The per-cutter
# PLT files keep naming their owning job, so a batch's file names match what
# each job produces standalone.
jobset:
  name: "Evening Batch"
  jobs:
    - job: "jobset example A.yaml"
    - job: "jobset example B.yaml"
