# Job specification reproducing examples/test123.plt (see test123_before.png):
# three 3in x 1in labels, each with one line of 0.5in text ("Test 1", "Test 2",
# "Test 3"), stacked in a single column on a 24in x 16in plate.
job:
  job_name: Sunwest SW0008

  # Shared label dimensions and typography (cascade down to every label).
  width: 3.0
  height: 1.0
  text_height: 0.75
  # 0.45 is the measured minimum for the longest lines (e.g. "B29ABe"); 0.5
  # leaves headroom so collision compression clears the side drill holes.
  max_h_compress: 0.5
  holes:
    - location: sides

  plates:
    - id: plate_1
      width: 24.0
      height: 16.0
      # Labels sit edge-to-edge in the reference file, so no padding between them.
      clearance_padding: 0.0

  labels:
    - id: labels
      replacement_text_file: 2026-7-22 sunwest 1x3 white 0.75 text on black with 2 holes.txt