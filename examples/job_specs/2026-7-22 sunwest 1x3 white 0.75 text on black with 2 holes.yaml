# Job specification: one 3in x 1in label per line of the replacement text
# file, each with 0.75in text and two side drill holes, packed onto
# auto-allocated default sheets.
#
# The replacement text file is declared at the job level: `labels` is
# optional because width/height/text_height/holes define the label and each
# data-file line provides its text content.
job:
  job_name: Sunwest SW0008

  # Shared label dimensions and typography (defines the generated labels).
  width: 3.0
  height: 1.0
  text_height: 0.75
  holes:
    - location: sides

  replacement_text_file: 2026-7-22 sunwest 1x3 white 0.75 text on black with 2 holes.txt