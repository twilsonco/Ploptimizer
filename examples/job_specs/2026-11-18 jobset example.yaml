# Batch two job files onto one pool of plates.
#
# Each member is a complete job spec in its own file; this document only lists
# them, in the order their strokes are laid out. One `generate` run packs every
# label of the set onto the merged plate list, writes ONE shared per-cutter PLT
# per plate (the members' toolpaths are concatenated per cutter, so the sheet is
# engraved in one pass), and still produces a report per job plus a batch
# report that splits the travel by job.
#
# Run:
#   plt-optimizer generate --jobset "2026-11-18 jobset example.yaml"
#
# Paths are relative to this file. A jobset cannot contain a jobset.
#
# The common shape is the short list form (`jobset:` directly listing `job:`
# entries, as in README.md). This example uses the mapping form because it
# names the batch: `name` becomes the file-name key of every shared toolpath
# (`kw_60_txt_evening_batch.plt`). Without it the key falls back to this
# file's stem, which is long enough to push names against the plotter's
# 39-character cap.
jobset:
  name: "Evening Batch"
  jobs:
    - job: "2026-11-18 jobset example A.yaml"
    - job: "2026-11-18 jobset example B.yaml"
